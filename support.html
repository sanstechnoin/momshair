<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Support Desk</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>body{background:#f0f2f5;}.msg-card{border-left:4px solid #1B4D3E;}</style>
</head>
<body class="p-4">
    <div class="container" style="max-width:600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-headset"></i> Support Desk</h5>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="supportToggle">
                    <label class="form-check-label text-white fw-bold" for="supportToggle" id="statusLabel">Offline</label>
                </div>
            </div>
            <div class="card-body">
                <h6 class="text-muted fw-bold mb-3 border-bottom pb-2">Incoming Messages</h6>
                <div id="msg-list" class="list-group list-group-flush">
                    <div class="text-center py-5"><div class="spinner-border text-secondary"></div></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, collection, query, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        const firebaseConfig = { apiKey: "AIzaSyA659yIOvlhVTm8-S6RtUDPXxVM8dZZ_kM", authDomain: "momshairoil-3010.firebaseapp.com", projectId: "momshairoil-3010", storageBucket: "momshairoil-3010.firebasestorage.app", messagingSenderId: "884566098620", appId: "1:884566098620:web:bca34f4f82d7b6712ec6b9" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Toggle Logic
        const toggle = document.getElementById('supportToggle');
        const label = document.getElementById('statusLabel');

        onSnapshot(doc(db, "settings", "support"), (d) => {
            const online = d.exists() ? d.data().isOnline : false;
            toggle.checked = online;
            label.innerText = online ? "🟢 Online (WhatsApp)" : "🔴 Offline (Form)";
        });

        toggle.addEventListener('change', async () => {
            await updateDoc(doc(db, "settings", "support"), { isOnline: toggle.checked });
        });

        // Message List
        const q = query(collection(db, "enquiries"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snap) => {
            const list = document.getElementById('msg-list');
            if(snap.empty) { list.innerHTML = '<p class="text-center text-muted">No messages.</p>'; return; }
            let html = '';
            snap.forEach(d => {
                const m = d.data();
                const t = m.timestamp ? new Date(m.timestamp.seconds*1000).toLocaleString() : '';
                html += `
                <div class="list-group-item msg-card bg-light mb-2 rounded">
                    <div class="d-flex justify-content-between mb-1">
                        <strong>${m.name}</strong><small class="text-muted">${t}</small>
                    </div>
                    <p class="mb-2 text-muted small">${m.message}</p>
                    <div class="d-flex gap-2">
                        <a href="https://wa.me/91${m.phone}" target="_blank" class="btn btn-sm btn-success"><i class="bi bi-whatsapp"></i> Reply</a>
                        <button class="btn btn-sm btn-outline-danger" onclick="del('${d.id}')">Delete</button>
                    </div>
                </div>`;
            });
            list.innerHTML = html;
        });

        window.del = async (id) => { if(confirm("Delete?")) await deleteDoc(doc(db, "enquiries", id)); };
    </script>
</body>
</html>

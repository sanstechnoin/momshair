<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Mom's Hair Oil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #f4f6f9; }
        
        /* Status Colors */
        .status-select { min-width: 150px; cursor: pointer; font-weight: 500; font-size: 0.9rem; }
        .status-Pending { background-color: #fff3cd; color: #856404; border-color: #ffeeba; }
        .status-Payment { background-color: #d1e7dd; color: #0f5132; border-color: #badbcc; }
        .status-Shipped { background-color: #cfe2ff; color: #084298; border-color: #b6d4fe; }
        .status-Delivered { background-color: #212529; color: #fff; border-color: #212529; }

        /* LOGIN OVERLAY STYLES */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1B4D3E; /* Brand Green */
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        /* Hide Dashboard initially */
        #admin-content { display: none; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h3 class="fw-bold mb-3" style="color: #1B4D3E;">Admin Login 🔒</h3>
            <p class="text-muted small mb-4">Restricted Access. Enter Password.</p>
            <input type="password" id="admin-pass" class="form-control mb-3 text-center" placeholder="Password">
            <button class="btn btn-success w-100" onclick="checkLogin()">Unlock Panel</button>
            <p id="login-error" class="text-danger small mt-2" style="display:none;">Incorrect Password</p>
        </div>
    </div>

    <div id="admin-content">
        <nav class="navbar navbar-dark bg-dark sticky-top shadow">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1"><i class="bi bi-shield-lock"></i> Admin Panel</span>
                <div>
                    <button class="btn btn-outline-light btn-sm me-2" onclick="location.reload()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                    <button class="btn btn-danger btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
                </div>
            </div>
        </nav>

        <div class="container-fluid mt-4">
            
            <div class="row mb-4">
                <div class="col-md-8 mx-auto">
                    <div class="card shadow-sm border-primary">
                        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="bi bi-box-seam"></i> Stock Management</h5>
                            <span class="badge bg-white text-primary">Live Updates</span>
                        </div>
                        <div class="card-body bg-white">
                            <p class="small text-muted mb-3"><i class="bi bi-info-circle"></i> Set Stock to <strong>0</strong> to automatically switch the website to "Pre-Order" mode.</p>
                            
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Daily Nourish</label>
                                    <input type="number" id="qty-p1" class="form-control text-center" value="0">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Restoration Oil</label>
                                    <input type="number" id="qty-p2" class="form-control text-center" value="0">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Combo Pack</label>
                                    <input type="number" id="qty-p3" class="form-control text-center" value="0">
                                </div>
                            </div>
                            
                            <button class="btn btn-success w-100 mt-3" onclick="saveInventory()">
                                <i class="bi bi-save"></i> Update Website Stock
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-white py-3 border-bottom">
                    <h5 class="mb-0"><i class="bi bi-list-check"></i> Recent Orders</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle table-bordered mb-0">
                            <thead class="table-light">
                                <tr class="text-center align-middle">
                                    <th>Date</th>
                                    <th>Order ID</th>
                                    <th class="text-start">Customer Info</th>
                                    <th style="width: 20%;" class="text-start">Shipping To</th>
                                    <th>Total & UTR</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr><td colspan="7" class="text-center py-5">Loading orders...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, orderBy, query, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA659yIOvlhVTm8-S6RtUDPXxVM8dZZ_kM",
            authDomain: "momshairoil-3010.firebaseapp.com",
            projectId: "momshairoil-3010",
            storageBucket: "momshairoil-3010.firebasestorage.app",
            messagingSenderId: "884566098620",
            appId: "1:884566098620:web:bca34f4f82d7b6712ec6b9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- PASSWORD PROTECTION LOGIC ---
        window.checkLogin = function() {
            const pass = document.getElementById('admin-pass').value;
            const errorMsg = document.getElementById('login-error');
            const overlay = document.getElementById('login-overlay');
            const content = document.getElementById('admin-content');

            if (pass === "brindharani") {
                overlay.style.display = 'none';
                content.style.display = 'block';
                sessionStorage.setItem("adminLoggedIn", "true");
                
                // Load data only after login
                loadOrders();
                loadInventory();
            } else {
                errorMsg.style.display = 'block';
            }
        };

        window.logout = function() {
            sessionStorage.removeItem("adminLoggedIn");
            location.reload();
        };

        // Check if already logged in (on refresh)
        if (sessionStorage.getItem("adminLoggedIn") === "true") {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadOrders();
            loadInventory();
        }

        // --- INVENTORY LOGIC ---
        async function loadInventory() {
            const pIds = ['p1', 'p2', 'p3'];
            for (const pid of pIds) {
                const docRef = doc(db, "products", pid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    document.getElementById(`qty-${pid}`).value = docSnap.data().stock;
                } else {
                    await setDoc(docRef, { stock: 10 }); 
                    document.getElementById(`qty-${pid}`).value = 10;
                }
            }
        }

        window.saveInventory = async function() {
            try {
                const p1 = parseInt(document.getElementById('qty-p1').value);
                const p2 = parseInt(document.getElementById('qty-p2').value);
                const p3 = parseInt(document.getElementById('qty-p3').value);

                await updateDoc(doc(db, "products", "p1"), { stock: p1 });
                await updateDoc(doc(db, "products", "p2"), { stock: p2 });
                await updateDoc(doc(db, "products", "p3"), { stock: p3 });

                alert("Stock Updated! Website will reflect changes immediately.");
            } catch (error) {
                console.error("Error saving stock:", error);
                alert("Error updating stock.");
            }
        }

        // --- WHATSAPP NOTIFY FUNCTION ---
        window.sendWhatsappUpdate = function(phone, name, orderId, status) {
            let msg = "";
            
            // Customize message based on status
            if(status === "Payment Received") {
                msg = `Hello ${name}, we have received your payment for Order ID ${orderId}. We are now preparing your fresh batch! 🌿`;
            } else if (status === "Shipped") {
                msg = `Great news ${name}! Your Mom's Hair Oil (Order ${orderId}) has been SHIPPED! 🚚 It will reach you soon.`;
            } else if (status === "Delivered") {
                msg = `Hi ${name}, your order ${orderId} is marked as Delivered. We hope you love the oil! Please share your review. ✨`;
            } else {
                msg = `Hello ${name}, an update on your Order ${orderId}. Current Status: ${status}.`;
            }

            // Open WhatsApp
            window.open(`https://wa.me/91${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        };

        // --- LOAD ORDERS ---
        async function loadOrders() {
            const tableBody = document.getElementById('tableBody');
            
            try {
                const q = query(collection(db, "orders"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                let html = '';
                if (querySnapshot.empty) {
                    tableBody.innerHTML = '<tr><td colspan="7" class="text-center py-5">No orders found yet.</td></tr>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const order = doc.data();
                    const date = order.timestamp ? new Date(order.timestamp.seconds * 1000).toLocaleDateString() : 'N/A';
                    
                    // Logic for Status Colors
                    let statusClass = "status-Pending";
                    if (order.status && order.status.includes("Payment")) statusClass = "status-Payment";
                    if (order.status && order.status.includes("Shipped")) statusClass = "status-Shipped";
                    if (order.status && order.status.includes("Delivered")) statusClass = "status-Delivered";

                    html += `
                        <tr class="text-center">
                            <td><small>${date}</small></td>
                            <td><span class="badge bg-secondary">${order.orderId || doc.id}</span></td>
                            <td class="text-start">
                                <strong>${order.name}</strong><br>
                                <a href="https://wa.me/${order.phone}" target="_blank" class="text-decoration-none small text-success">
                                    <i class="bi bi-whatsapp"></i> ${order.phone}
                                </a>
                            </td>
                            <td class="text-start"><small>${order.address}</small></td>
                            <td>
                                <strong>₹${order.total}</strong><br>
                                <small class="text-muted">UTR: ${order.txnId || 'N/A'}</small>
                            </td>
                            <td>
                                <select class="form-select form-select-sm status-select ${statusClass}" onchange="updateStatus('${doc.id}', this.value)">
                                    <option value="Pending Verification" ${order.status === 'Pending Verification' ? 'selected' : ''}>Pending Verif.</option>
                                    <option value="Payment Received" ${order.status === 'Payment Received' ? 'selected' : ''}>Payment Received</option>
                                    <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                    <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                </select>
                            </td>
                            <td>
                                <div class="d-flex flex-column gap-1">
                                    <button class="btn btn-sm btn-outline-primary" onclick="alert('Items:\\n' + '${order.items}'.replace(/\\n/g, '\\n'))">
                                        <i class="bi bi-eye"></i> Details
                                    </button>
                                    <button class="btn btn-sm btn-success" onclick="sendWhatsappUpdate('${order.phone}', '${order.name}', '${order.orderId}', '${order.status}')">
                                        <i class="bi bi-whatsapp"></i> Notify
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                tableBody.innerHTML = html;
            } catch (error) {
                console.error("Error loading orders:", error);
                tableBody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Error loading data. Check Console.</td></tr>`;
            }
        }

        window.updateStatus = async function(docId, newStatus) {
            try {
                const orderRef = doc(db, "orders", docId);
                await updateDoc(orderRef, { status: newStatus });
                // Don't alert here to be faster, just reload
                loadOrders(); 
            } catch (e) {
                console.error("Error updating status: ", e);
                alert("Error updating status");
            }
        }
    </script>
</body>
</html>
